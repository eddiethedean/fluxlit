# Merge with docker-compose.yml: HTTPS on 8443 (dev self-signed certs).
# Run: ./generate-test-certs.sh
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build
# Public URL: https://127.0.0.1:8444/myapp/  (8444 avoids common local :8443 conflicts)
services:
  nginx:
    ports:
      - "8080:80"
      - "8444:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
