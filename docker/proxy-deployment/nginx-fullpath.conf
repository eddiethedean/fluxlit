# Reverse proxy forwards the full browser path (e.g. /myapp/...) unchanged to FluxLit.
# FluxLit uses FLUXLIT_ROOT_PATH=/myapp so split_gateway_paths strips for dispatch only.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fluxlit {
    server fluxlit:8000;
}

server {
    listen 80;
    server_name _;

    location = /myapp {
        return 301 /myapp/;
    }

    location /myapp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        # No URI in proxy_pass: forward full request URI (incl. /myapp/...).
        proxy_pass http://fluxlit;
    }
}
