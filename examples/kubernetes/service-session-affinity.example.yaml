# Optional: ClientIP session affinity on the FluxLit Service.
# Apply only after validating your LB and Streamlit WebSocket behavior; IP-based
# affinity is coarse (NAT, mobile) and does not replace an external SessionStore
# for cookie-free URL sessions — see docs/deployment.md and docs/url-session.md.
#
# Not applied by default. Merge with your real Service or patch in place:
#   kubectl apply -f deployment.yaml
#   kubectl apply -f service-session-affinity.example.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: fluxlit-app
  labels:
    app: fluxlit-app
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app: fluxlit-app
