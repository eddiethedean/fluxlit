name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install for audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install -e ".[auth]"

      - name: pip-audit (dependencies)
        run: python -m pip_audit

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Validate release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")
          PY

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: |
          python -m pytest -n auto -m "not slow" \
            --cov=fluxlit --cov-report=term-missing --cov-fail-under=100

      - name: Mypy
        run: python -m mypy src/fluxlit

      - name: Generated docs are current
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          Path("docs/_generated/setup.txt").write_text(
              f"fluxlit version: {version('fluxlit')}\n",
              encoding="utf-8",
          )
          PY
          COLUMNS=80 NO_COLOR=1 fluxlit --help > docs/_generated/fluxlit_help_entrypoint.txt
          git diff --exit-code -- docs/_generated

      - name: Sphinx (warnings as errors)
        run: sphinx-build -b html -W docs docs/_build/html

  publish:
    needs: [checks, security-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate built artifacts
        run: |
          python -m twine check dist/*
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import fluxlit
          from importlib.metadata import version

          assert fluxlit.__version__ == version("fluxlit")
          assert fluxlit.__version__
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
