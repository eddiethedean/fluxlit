name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: python -m pytest -n auto -m "not slow" --cov=fluxlit --cov-report=term-missing --cov-fail-under=100

      - name: Mypy
        run: python -m mypy src/fluxlit

  fluxlit-run-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: fluxlit run subprocess smoke
        run: bash scripts/smoke_fluxlit_run.sh

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Slow tests
        run: python -m pytest -m slow -q --tb=short

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest (coverage gate matches release)
        run: |
          python -m pytest -n auto -m "not slow" \
            --cov=fluxlit --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=100

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Mypy
        run: python -m mypy src/fluxlit

      - name: Generated docs are current
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          Path("docs/_generated/setup.txt").write_text(
              f"fluxlit version: {version('fluxlit')}\n",
              encoding="utf-8",
          )
          PY
          COLUMNS=80 NO_COLOR=1 fluxlit --help | python -c 'import re, sys; sys.stdout.write(re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", sys.stdin.read()))' > docs/_generated/fluxlit_help_entrypoint.txt
          git diff --exit-code -- docs/_generated

      - name: Sphinx HTML (warnings as errors)
        run: sphinx-build -b html -W docs docs/_build/html

  proxy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websockets (smoke_ws.py)
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets

      - name: Proxy matrix
        working-directory: docker/proxy-deployment
        run: |
          ./run-all-proxy-smokes.sh

      - name: Cleanup proxy smoke containers
        if: always()
        working-directory: docker/proxy-deployment
        run: |
          docker compose -f docker-compose.yml -f docker-compose.root.yml down -v || true
          docker compose -f docker-compose.yml down -v || true
          docker compose -f docker-compose.yml -f docker-compose.fullpath.yml down -v || true
          docker compose -f docker-compose.yml -f docker-compose.https.yml down -v || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]"

      - name: Playwright (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: E2E tests
        run: python -m pytest tests/e2e -m e2e --tb=short -q --tracing=retain-on-failure

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  ty-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,metrics]"
          # Pin ty so CI does not break on new diagnostics between upgrades.
          python -m pip install "ty==0.0.35"

      - name: ty check
        run: ty check

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install for audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit cyclonedx-bom
          # Runtime-relevant tree: core + auth (cryptography/PyJWT). Dev/docs extras pull in
          # many transitive tools (pytest, Sphinx, Streamlit) with separate advisory churn.
          python -m pip install -e ".[auth]"

      - name: pip-audit (dependencies)
        run: python -m pip_audit

      - name: CycloneDX SBOM (same install surface as pip-audit)
        run: cyclonedx-py environment --pyproject pyproject.toml -o cyclonedx-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: cyclonedx-sbom.json
