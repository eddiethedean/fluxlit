name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: python -m pytest -n auto --ignore=tests/e2e

      - name: Mypy
        run: python -m mypy src/fluxlit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Sphinx HTML
        run: sphinx-build -b html docs docs/_build/html

  proxy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websockets (smoke_ws.py)
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets

      - name: Strip-prefix proxy
        working-directory: docker/proxy-deployment
        run: |
          docker compose -f docker-compose.yml up -d --build
          ./smoke-test.sh
          docker compose -f docker-compose.yml down -v

      - name: Full-path proxy
        working-directory: docker/proxy-deployment
        run: |
          docker compose -f docker-compose.yml -f docker-compose.fullpath.yml up -d --build
          BASE_URL=http://127.0.0.1:8081 ./smoke-test.sh
          docker compose -f docker-compose.yml -f docker-compose.fullpath.yml down -v

      - name: HTTPS proxy
        working-directory: docker/proxy-deployment
        run: |
          ./generate-test-certs.sh
          docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
          CURL_INSECURE=1 BASE_URL=https://127.0.0.1:8444 ./smoke-test.sh
          docker compose -f docker-compose.yml -f docker-compose.https.yml down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]"

      - name: Playwright (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: E2E tests
        run: python -m pytest tests/e2e -m e2e --tb=short -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install for audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          # Runtime-relevant tree: core + auth (cryptography/PyJWT). Dev/docs extras pull in
          # many transitive tools (pytest, Sphinx, Streamlit) with separate advisory churn.
          python -m pip install -e ".[auth]"

      - name: pip-audit (dependencies)
        run: python -m pip_audit
