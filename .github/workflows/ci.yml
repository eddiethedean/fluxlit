name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: python -m pytest -n auto -m "not slow"

      - name: Mypy
        run: python -m mypy src/fluxlit

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Slow tests
        run: python -m pytest -m slow -q --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        run: |
          python -m pytest -n auto -m "not slow" \
            --cov=fluxlit --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Sphinx HTML
        run: sphinx-build -b html docs docs/_build/html -W

  proxy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websockets (smoke_ws.py)
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets

      - name: Strip-prefix proxy
        working-directory: docker/proxy-deployment
        run: |
          docker compose -f docker-compose.yml up -d --build
          ./smoke-test.sh
          docker compose -f docker-compose.yml down -v

      - name: Full-path proxy
        working-directory: docker/proxy-deployment
        run: |
          docker compose -f docker-compose.yml -f docker-compose.fullpath.yml up -d --build
          BASE_URL=http://127.0.0.1:8081 ./smoke-test.sh
          docker compose -f docker-compose.yml -f docker-compose.fullpath.yml down -v

      - name: HTTPS proxy
        working-directory: docker/proxy-deployment
        run: |
          ./generate-test-certs.sh
          docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
          CURL_INSECURE=1 BASE_URL=https://127.0.0.1:8444 ./smoke-test.sh
          docker compose -f docker-compose.yml -f docker-compose.https.yml down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]"

      - name: Playwright (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: E2E tests
        run: python -m pytest tests/e2e -m e2e --tb=short -q --tracing=retain-on-failure

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  ty-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,metrics]"
          # Pin ty so CI does not break on new diagnostics between upgrades.
          python -m pip install "ty==0.0.35"

      - name: ty check
        run: ty check

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install for audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit cyclonedx-bom
          # Runtime-relevant tree: core + auth (cryptography/PyJWT). Dev/docs extras pull in
          # many transitive tools (pytest, Sphinx, Streamlit) with separate advisory churn.
          python -m pip install -e ".[auth]"

      - name: pip-audit (dependencies)
        run: python -m pip_audit

      - name: CycloneDX SBOM (same install surface as pip-audit)
        run: cyclonedx-py environment --pyproject pyproject.toml -o cyclonedx-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: cyclonedx-sbom.json
