# Weekly / manual: install latest Streamlit + FastAPI + Starlette and run fast tests.
# Intended for triage (allow failure) — not a merge gate.
name: Upgrade smoke

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  latest-deps:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with latest upstream stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U streamlit fastapi starlette "httpx>=0.27" pydantic pydantic-settings
          python -m pip install -e ".[dev]"

      - name: Fast tests
        run: python -m pytest -n auto -m "not slow" -q --tb=line
