[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxlit"
version = "0.5.0"
description = "Production-oriented unified runtime for FastAPI + Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FluxLit contributors" }]
keywords = ["fastapi", "streamlit", "asgi", "web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.0",
  "fastapi>=0.111",
  "httpx>=0.27",
  "pydantic-settings>=2.0",
  "starlette>=0.37",
  "streamlit>=1.36",
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12",
  "uvicorn[standard]>=0.29",
  "watchfiles>=0.21",
  "websockets>=12",
]

[project.optional-dependencies]
auth = [
  "PyJWT[crypto]>=2.8.0",
  "cryptography>=42.0.0",
]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.4",
  "tomli>=2.0",
  # JWT/OIDC tests and type-checking import PyJWT
  "PyJWT[crypto]>=2.8.0",
  "cryptography>=42.0.0",
  "prometheus-client>=0.20",
]
metrics = [
  "prometheus-client>=0.20",
]
e2e = [
  "pytest-playwright>=0.5",
]
docs = [
  "furo>=2024.1",
  "itsdangerous>=2.0",
  "myst-parser>=3.0",
  "sphinx>=7.0",
  "sphinx-autodoc-typehints>=2.0",
]

[project.scripts]
fluxlit = "fluxlit.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/fluxlit"
Documentation = "https://fluxlit.readthedocs.io/en/stable/"
Changelog = "https://github.com/eddiethedean/fluxlit/blob/main/CHANGELOG.md"
Security = "https://github.com/eddiethedean/fluxlit/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxlit"]

[tool.hatch.build.targets.sdist]
include = [
  "src/fluxlit",
  "examples",
  "docs",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "PLAN.md",
  "ROADMAP.md",
  "pyproject.toml",
  ".readthedocs.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["fluxlit"]
mypy_path = ["src"]
explicit_package_bases = true

# Streamlit depends on pyarrow; pyarrow vendors code that imports sphinx.ext.autodoc,
# which pulls Sphinx sources using syntax above our python_version target.
[[tool.mypy.overrides]]
module = "pyarrow.*"
follow_imports = "skip"

[tool.ty.src]
# Package + tests; examples/docker/scripts stay out of default ty scope.
include = ["src", "tests"]

# Tests use Starlette/FastAPI stubs, dynamic imports, and intentional mis-typing; relax ty there.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
call-top-callable = "ignore"
no-matching-overload = "ignore"
unresolved-import = "ignore"

[tool.coverage.run]
source = ["src/fluxlit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--ignore=tests/e2e"]
testpaths = ["tests"]
markers = [
  "e2e: browser tests (install .[e2e] and run playwright install chromium)",
  "slow: subprocess or long-running tests (skipped in default CI matrix)",
]
